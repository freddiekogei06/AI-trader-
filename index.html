<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Market Analyzer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; box-sizing: border-box; font-size: 16px; }
    input, select { background: #0f172a; color: white; }
    button { background: #3b82f6; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:active { background: #2563eb; }
    .btn-trade { background: #10b981; margin-top: 15px; }
    #resultBox { margin-top: 15px; padding: 12px; border-radius: 8px; background: #0f172a; font-size: 14px; text-align: left; line-height: 1.6; }
    .buy { color: #34d399; font-weight: bold; }
    .sell { color: #f87171; font-weight: bold; }
    .status { color: #38bdf8; font-size: 13px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>AI Market Analyzer</h2>

    <label>Deriv API Token:</label>
    <input type="password" id="apiToken" placeholder="Paste your Deriv token">

    <label>Market Asset:</label>
    <select id="symbol">
      <option value="R_100">Volatility 100 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="1HZ100V">Volatility 100 (1s) Index</option>
      <option value="frxEURUSD">EUR/USD Forex</option>
    </select>

    <label>Stake Amount ($):</label>
    <input type="number" id="stake" value="1" min="0.5" step="0.5">

    <button onclick="runAnalysis()">⚡ Analyze Market</button>

    <div id="resultBox">Ready. Tap 'Analyze Market' to start.</div>

    <button id="tradeBtn" class="btn-trade" style="display:none;" onclick="placeTrade()">Execute Trade</button>
  </div>

  <script>
    // Load saved token from phone memory
    const tokenInput = document.getElementById('apiToken');
    if (localStorage.getItem('deriv_token')) {
      tokenInput.value = localStorage.getItem('deriv_token');
    }
    tokenInput.addEventListener('input', () => {
      localStorage.setItem('deriv_token', tokenInput.value.trim());
    });

    let ws;
    let latestSignal = null;

    function runAnalysis() {
      const resultBox = document.getElementById('resultBox');
      const tradeBtn = document.getElementById('tradeBtn');
      const symbol = document.getElementById('symbol').value;

      tradeBtn.style.display = "none";
      resultBox.innerHTML = "<span class='status'>Connecting to Deriv server...</span>";

      if (ws) { ws.close(); }

      // Uses Deriv's official public WebSocket connection (App ID 1089)
      ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

      ws.onopen = () => {
        resultBox.innerHTML = "<span class='status'>Connected! Downloading live candle data...</span>";
        
        // Fetch 50 candles (Free, no token required to analyze)
        ws.send(JSON.stringify({
          ticks_history: symbol,
          adjust_start_time: 1,
          count: 50,
          end: "latest",
          style: "candles",
          granularity: 60
        }));
      };

      ws.onerror = () => {
        resultBox.innerHTML = "<span class='sell'>Connection failed. Check your data connection.</span>";
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.error) {
          resultBox.innerHTML = `<span class='sell'>Deriv Error: ${data.error.message}</span>`;
          return;
        }

        if (data.msg_type === 'candles') {
          analyzeStrategy(data.candles);
        }

        if (data.msg_type === 'authorize') {
          resultBox.innerHTML += "<br><span class='status'>Token verified! Executing order...</span>";
          sendOrder();
        }

        if (data.msg_type === 'buy') {
          resultBox.innerHTML += `<br><span class='buy'>✓ Trade Placed Successfully!<br>Contract ID: ${data.buy.contract_id}</span>`;
          tradeBtn.style.display = "none";
        }
      };
    }

    function analyzeStrategy(candles) {
      const closes = candles.map(c => c.close);
      const currentPrice = closes[closes.length - 1];

      // Calculate Simple Moving Average
      const sma = closes.reduce((a, b) => a + b, 0) / closes.length;

      // Calculate RSI
      let gains = 0, losses = 0;
      for (let i = closes.length - 14; i < closes.length; i++) {
        let diff = closes[i] - closes[i - 1];
        if (diff >= 0) gains += diff;
        else losses -= diff;
      }
      let rs = gains / (losses || 1);
      let rsi = 100 - (100 / (1 + rs));

      let signal = "NEUTRAL";
      let confidence = 50;

      if (currentPrice > sma && rsi < 70) {
        signal = "BUY";
        confidence = Math.min(88, Math.round(55 + (rsi / 3)));
      } else if (currentPrice < sma && rsi > 30) {
        signal = "SELL";
        confidence = Math.min(88, Math.round(55 + ((100 - rsi) / 3)));
      }

      latestSignal = signal;

      const resultBox = document.getElementById('resultBox');
      const tradeBtn = document.getElementById('tradeBtn');

      resultBox.innerHTML = `
        <strong>Asset:</strong> ${document.getElementById('symbol').value}<br>
        <strong>Current Price:</strong> ${currentPrice}<br>
        <strong>RSI (Momentum):</strong> ${rsi.toFixed(1)}<br>
        <strong>Signal:</strong> <span class="${signal === 'BUY' ? 'buy' : 'sell'}">${signal}</span><br>
        <strong>AI Confidence:</strong> ${confidence}%
      `;

      if (signal !== "NEUTRAL") {
        tradeBtn.style.display = "block";
        tradeBtn.innerText = `Execute ${signal} Trade`;
      }
    }

    function placeTrade() {
      const token = document.getElementById('apiToken').value.trim();
      if (!token) {
        alert("Please paste your Deriv API token before placing a trade!");
        return;
      }
      document.getElementById('resultBox').innerHTML += "<br><span class='status'>Authorizing demo account...</span>";
      ws.send(JSON.stringify({ authorize: token }));
    }

    function sendOrder() {
      const stake = parseFloat(document.getElementById('stake').value);
      const symbol = document.getElementById('symbol').value;
      const contractType = latestSignal === "BUY" ? "CALL" : "PUT";

      ws.send(JSON.stringify({
        buy: 1,
        price: stake,
        parameters: {
          amount: stake,
          basis: "stake",
          contract_type: contractType,
          currency: "USD",
          duration: 5,
          duration_unit: "m",
          symbol: symbol
        }
      }));
    }
  </script>
</body>
</html>
